<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>وصفتي</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f3f6f4;--card:#fff;--ink:#14302b;--muted:#5f7470;--line:#dde6e2;
  --brand:#0f6b5c;--brand2:#e3f1ec;--warn:#b5520b;--warnbg:#fff1e3;--danger:#b3261e;--dangerbg:#fde8e6;--ok:#1d7a46;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.6;padding-top:var(--safe-t)}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;padding:0 14px calc(90px + var(--safe-b))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}
header.top h1{font-size:21px;font-weight:700;display:flex;gap:8px;align-items:center}
header.top h1 .logo{width:32px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-p{background:var(--brand);color:#fff}
.btn-s{background:var(--brand2);color:var(--brand)}
.btn-g{background:#fff;border:1px solid var(--line)}
.btn-d{background:var(--dangerbg);color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
h2{font-size:17px;margin:6px 0 10px}
h3{font-size:15px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b);z-index:20}
.tabs .in{display:flex;max-width:640px;width:100%}
.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tabs button span{font-size:20px;line-height:1.2}
.tabs button.on{color:var(--brand);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .big{font-size:40px}
.dose{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dose:first-of-type{border-top:0}
.dose .t{font-weight:700;min-width:52px;color:var(--brand)}
.check{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:18px;cursor:pointer;flex:none}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--brand2);color:var(--brand);font-weight:600}
.pill.grey{background:#eef1f0;color:var(--muted)}
.alert{border-radius:12px;padding:9px 12px;font-size:13.5px;margin:8px 0;line-height:1.6}
.alert.w{background:var(--warnbg);color:var(--warn)}
.alert.d{background:var(--dangerbg);color:var(--danger)}
.alert.i{background:var(--brand2);color:var(--brand)}
.seg{display:flex;background:#e8eeec;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.med{border-top:1px solid var(--line);padding:12px 0}
.med:first-child{border-top:0;padding-top:4px}
.med .name{font-weight:700;font-size:16px}
.expl{font-size:15px;line-height:1.8;margin-top:4px}
.expl[dir=ltr]{text-align:left}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th{color:var(--muted);font-weight:600;font-size:12.5px}
.tbl .num{text-align:left;white-space:nowrap}
.tbl tr.total td{font-weight:700;border-bottom:0;font-size:15.5px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:#fafcfb;border-radius:11px;padding:9px 11px;font-size:15px}
textarea.i{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .x{margin-right:6px;opacity:.7}
.item-ed{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:#fcfdfc}
.item-ed .hd{display:flex;justify-content:space-between;align-items:center}
.overlay{position:fixed;inset:0;background:rgba(10,25,22,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + var(--safe-b))}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:2}
.toast{position:fixed;bottom:calc(84px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.rx{display:flex;gap:12px;align-items:center;cursor:pointer}
.rx .ic{width:46px;height:46px;border-radius:12px;background:var(--brand2);display:grid;place-items:center;font-size:22px;flex:none}
.small{font-size:12.5px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:14px 6px}
.hide{display:none!important}
a{color:var(--brand)}
.who{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13.5px;cursor:pointer;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{background:var(--brand);color:#fff;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.next .big{font-size:22px;font-weight:700}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px}
.b-red{background:var(--dangerbg);color:var(--danger)}.b-or{background:var(--warnbg);color:var(--warn)}.b-ok{background:#e2f4ea;color:var(--ok)}
.ck{display:flex;align-items:center;gap:6px;font-size:13.5px;margin-top:8px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--brand)}
.steps{display:flex;gap:4px;margin-top:8px}.steps button{flex:1;font-size:12px;padding:7px 2px}
/* وضع كبار السن */
body.big{font-size:18px}
body.big .btn{padding:13px 16px;font-size:17px}
body.big .btn-sm{padding:9px 12px;font-size:15px}
body.big .check{width:56px;height:56px;font-size:26px}
body.big .dose{padding:14px 0}
body.big .dose .t{font-size:20px;min-width:66px}
body.big .dose b{font-size:19px}
body.big .tabs button{font-size:13.5px}body.big .tabs button span{font-size:26px}
body.big .small{font-size:15px}
body.big .expl{font-size:18px}
body.big .next .big{font-size:28px}
.bx{width:46px;height:46px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex:none;background:#fff;cursor:zoom-in}
.bx.sm{width:38px;height:38px}.bx.lg{width:96px;height:96px;cursor:default}
.bx.none{display:grid;place-items:center;font-size:20px;background:var(--brand2);cursor:default}
body.big .bx{width:60px;height:60px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.lb.show{display:flex}.lb img{max-width:100%;max-height:90vh;border-radius:12px}
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;inset:0;padding:18px;font-size:13px;color:#000}
  #print h1{font-size:19px;margin-bottom:4px}
  #print .med{border-top:1px solid #ccc;padding:8px 0}
  #print table{width:100%;border-collapse:collapse;margin-top:10px}
  #print td,#print th{border:1px solid #ccc;padding:5px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><span class="logo">💊</span>وصفتي</h1>
    <button class="who" id="whoBtn" onclick="peopleSheet()"></button>
  </header>
  <div id="frameNote" class="alert i hide">👀 هادي معاينة. باش يخدمو التنبيهات فالكاليندر، الـ PDF والتحميل، حط التطبيق فـ GitHub Pages وسطبو فالتليفون.</div>
  <main id="view"></main>
  <p class="disc">التطبيق كيعاود غير داكشي اللي كتب الطبيب. ما كيبدلش الجرعة وما كيوقفش الدواء. إلا شكيتي فشي حاجة، سول الطبيب ولا الصيدلي.</p>
</div>

<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb" onclick="this.classList.remove('show')"><img id="lbImg" alt=""></div>
<div id="print"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fileAny" class="hide">

<script>
/* ================= أدوات عامة ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoDay(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoDay(d)};
const fmtDate=iso=>{if(!iso)return'';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('ar-MA',{day:'numeric',month:'long',year:'numeric'})};
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('fr-MA',{minimumFractionDigits:2,maximumFractionDigits:2})+' درهم';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u0600-\u06ff]+/g,' ').trim();
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}

/* ================= التخزين (IndexedDB مع بديل) ================= */
const DB={db:null,mem:{},
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('wasfati',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  async get(k){if(!this.db)return this.mem[k];try{return await new Promise((res,rej)=>{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return this.mem[k]}},
  async set(k,v){this.mem[k]=v;if(!this.db)return;try{await new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
};
const newPerson=(name='')=>({id:uid(),name,allergies:[],org:'cnss',rate:70,aldRate:100});
const blank=()=>{const p=newPerson('أنا');return{v:2,profile:{lang:'dr',big:false},people:[p],cur:p.id,catalog:[],rx:[],taken:{},pharmacies:[],interactions:[],home:[],recalls:[]}};
let S=blank();
function migrate(d){
  const s={...blank(),...d};
  if(!Array.isArray(d.people)||!d.people.length){const p=newPerson(d.profile?.name||'أنا');p.allergies=d.profile?.allergies||[];s.people=[p];s.cur=p.id}
  if(!s.people.some(p=>p.id===s.cur))s.cur=s.people[0].id;
  for(const r of s.rx)if(!r.personId)r.personId=s.people[0].id;
  s.home=s.home||[];s.recalls=s.recalls||[];s.profile={lang:'dr',big:false,...(s.profile||{})};
  return s;
}
const me=()=>S.people.find(p=>p.id===S.cur)||S.people[0];
const personOf=r=>S.people.find(p=>p.id===r.personId)||me();
const myRx=()=>S.rx.filter(r=>r.personId===S.cur);
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>DB.set('state',S),250)}

/* ================= قاعدة الأدوية المرجعية (اللائحة الرسمية) ================= */
// صف واحد: {n:الاسم, d:DCI, dz:الدوزاج, f:الشكل/التقديم, p:PPV, b:الباركود, l:المختبر}
let REF=null, refIdx=null;
function buildRefIdx(){
  refIdx={byBc:new Map(),byName:new Map()};if(!REF)return;
  for(const r of REF.rows){r._s=norm([r.n,r.d,r.dz,r.l].join(' '));if(r.b)refIdx.byBc.set(r.b,r);refIdx.byName.set(norm(refLabel(r)),r)}
}
const refLabel=r=>{let s=r.n||'';if(r.dz&&!norm(s).includes(norm(r.dz)))s+=' '+r.dz;if(r.f&&!norm(s).includes(norm(r.f)))s+=' — '+r.f;return s.trim()};
function refSearch(q,lim=25){q=norm(q);if(!q||!REF)return[];const parts=q.split(' ');const out=[];for(const r of REF.rows){if(parts.every(p=>r._s.includes(p))){out.push(r);if(out.length>=lim)break}}return out}
function refFor(c){if(!REF||!c)return null;return (c.barcode&&refIdx.byBc.get(c.barcode))||refIdx.byName.get(norm(c.name))||null}
function catFromRef(r){
  let c=S.catalog.find(x=>(r.b&&x.barcode===r.b)||norm(x.name)===norm(refLabel(r)));
  if(!c){c={id:uid(),name:refLabel(r),dci:r.d||'',use:'',price:r.p||0,barcode:r.b||''};S.catalog.push(c);save()}
  else if(r.p&&c.price!==r.p){c.price=r.p;save()}
  return c;
}
const strength=s=>{const m=String(s||'').toLowerCase().replace(',','.').match(/(\d+(?:\.\d+)?)\s*(mg|g|µg|mcg|ui|ml|%)/);return m?(+m[1])+m[2]:''};
const FORMS=[['cp','comprim'],['gel','gelul'],['sach','sachet'],['sir','sirop'],['inj','inject'],['supp','suppo'],['pom','pommade'],['cr','creme'],['gtt','goutte'],['susp','suspension']];
const formOf=s=>{const n=norm(s);const f=FORMS.find(([k,w])=>n.includes(w));return f?f[0]:''};
function cheaperOptions(it){
  if(!REF)return[];const inf=itemInfo(it);if(!inf.dci||!inf.price)return[];
  const c=it.catId?catFind(it.catId):null;const me=refFor(c);
  const myLabel=me?refLabel(me):inf.name, st=strength(me?.dz||myLabel), fm=formOf(myLabel);
  if(!st)return[]; // بلا دوزاج معروف ما نقارنوش
  const d=norm(inf.dci);
  return REF.rows.filter(r=>r.p&&r.p<inf.price&&norm(r.d)===d&&strength(r.dz||refLabel(r))===st&&(!fm||!formOf(refLabel(r))||formOf(refLabel(r))===fm)&&r!==me)
    .sort((a,b)=>a.p-b.p).slice(0,2);
}
let sheetjsP=null;
function loadSheetJS(){if(window.XLSX)return Promise.resolve();if(!sheetjsP)sheetjsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=()=>{sheetjsP=null;rej()};document.head.appendChild(s)});return sheetjsP}
const COLS={
  n:['nom','designation','specialite','denomination','produit','libelle','name','medicament'],
  d:['dci','substance','principe','composition','molecule'],
  dz:['dosage','concentration'],
  f:['forme','presentation','conditionnement'],
  p:['ppv','prix public','prix de vente','price','prix'],
  b:['code barre','codebarre','code barre','ean','gtin','barcode','code_barre','cip'],
  l:['laboratoire','titulaire','fabricant','labo'],
};
function detectCols(row){
  const h=row.map(x=>norm(x));const cols={};let score=0;
  for(const k in COLS){
    let idx=-1;
    for(const w of COLS[k]){idx=h.findIndex((x,i)=>x&&x.includes(norm(w))&&!Object.values(cols).includes(i)&&!(k==='p'&&/hop|ph |pfht|ppm|base/.test(x)));if(idx>=0)break}
    if(idx>=0){cols[k]=idx;score++}
  }
  return {cols,score};
}
function mapRows(aoa){
  let best={score:0},hi=-1;
  for(let i=0;i<Math.min(25,aoa.length);i++){const d=detectCols(aoa[i]||[]);if(d.score>best.score&&d.cols.n!=null){best=d;hi=i}}
  if(hi<0||best.score<2)throw new Error('cols');
  const C=best.cols,out=[];
  const num=v=>{const s=String(v??'').replace(/\s| /g,'').replace(/dh|mad/ig,'').replace(',','.');const x=parseFloat(s);return isFinite(x)?Math.round(x*100)/100:0};
  for(const row of aoa.slice(hi+1)){
    const n=String(row[C.n]??'').trim();if(!n)continue;
    const r={n};
    if(C.d!=null&&row[C.d])r.d=String(row[C.d]).trim();
    if(C.dz!=null&&row[C.dz])r.dz=String(row[C.dz]).trim();
    if(C.f!=null&&row[C.f])r.f=String(row[C.f]).trim();
    if(C.p!=null){const p=num(row[C.p]);if(p)r.p=p}
    if(C.b!=null){const b=String(row[C.b]??'').replace(/\D/g,'');if(b.length>=8)r.b=b.length===14?b.replace(/^0/,''):b}
    if(C.l!=null&&row[C.l])r.l=String(row[C.l]).trim();
    out.push(r);
  }
  return {rows:out,cols:Object.keys(C)};
}
async function setRef(rows,source,date){
  REF={meta:{count:rows.length,source,date:date||today()},rows};
  buildRefIdx();
  let upd=0;for(const c of S.catalog){const r=refFor(c);if(r&&r.p&&r.p!==c.price){c.price=r.p;upd++}if(r&&!c.dci&&r.d)c.dci=r.d}
  save();
  await DB.set('ref',{meta:REF.meta,rows:rows.map(({_s,...r})=>r)});
  return upd;
}
async function importRefFile(){
  const f=await pickFile(false,'.xlsx,.xls,.csv,.json,.txt');if(!f)return;
  toast('كنقرا الملف…',8000);
  try{
    let aoa;
    if(/\.json$/i.test(f.name)){const j=JSON.parse(await f.text());if(!Array.isArray(j.rows))throw new Error('json');const upd=await setRef(j.rows,j.meta?.source||f.name,j.meta?.date);toast(`✅ ${j.rows.length} دواء${upd?` · تحدث ثمن ${upd} فالكتالوج`:''}`,4000);render();return}
    if(/\.(csv|txt)$/i.test(f.name)){const txt=await f.text();const lines=txt.split(/\r?\n/);const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':(lines[0].includes('\t')?'\t':',');aoa=lines.map(l=>csvSplit(l,sep))}
    else{await loadSheetJS();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});aoa=[];for(const sn of wb.SheetNames){const part=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});if(!aoa.length)aoa=part;else{try{mapRows(part);aoa=aoa.concat(part.slice(1))}catch(e){}}}}
    const {rows,cols}=mapRows(aoa);
    if(!rows.length)throw new Error('empty');
    const upd=await setRef(rows,f.name);

function warningsFor(r){
  const W=[];const al=(personOf(r).allergies||[]).map(norm).filter(Boolean);
  const list=r.items.map(it=>({it,...itemInfo(it)}));
  // الأدوية الأخرى اللي خدامة دابا عند نفس الشخص
  const others=[];for(const o of S.rx)if(o.id!==r.id&&o.personId===r.personId&&rxActive(o))for(const it of o.items)others.push({it,...itemInfo(it),from:o});
  for(const h of recallHitsRx(r))W.push({lvl:'d',txt:h});

    const hay=norm(m.name+' '+m.dci);

  }
  const all=[...list,...others];
  for(let i=0;i<list.length;i++)for(let j=0;j<all.length;j++){
    const A=list[i],B=all[j];if(j<list.length&&j<=i)continue;
    if(A.dci&&B.dci&&norm(A.dci)===norm(B.dci))W.push({lvl:'w',txt:`🔁 نفس المادة الفعالة (${A.dci}) كاينة فـ «${A.name}» و«${B.name}»${B.from?' (وصفة أخرى)':''}. تأكد مع الصيدلي باش ما تاخدش الجرعة جوج مرات.`});
    for(const x of S.interactions){

}

const qtyNum=q=>{q=String(q||'1').trim().replace(',','.');const f=q.match(/^(\d+)\s*\/\s*(\d+)$/);if(f)return(+f[1])/(+f[2]);const n=parseFloat(q);return isFinite(n)&&n>0?n:1};
function stockOf(r,it){
  const per=+it.perBox;if(!per)return null;
  const takenN=Object.keys(S.taken).filter(k=>k.includes(`|${r.id}|${it.id}|`)).length;
  const left=Math.max(0,(+it.boxes||1)*per+(+it.stockAdj||0)-takenN*qtyNum(it.qty));
  const perDay=(it.times||[]).length*qtyNum(it.qty);
  const daysLeft=perDay?Math.floor(left/perDay):null;
  let need=null;if(+it.days){const end=addDays(r.date,+it.days-1);const rem=Math.max(0,Math.round((new Date(end+'T12:00')-new Date(today()+'T12:00'))/864e5)+1);need=rem}
  const low=daysLeft!=null&&itemActiveOn(r,it,today())&&daysLeft<=3&&(need==null||need>daysLeft);
  return{left:Math.round(left*10)/10,daysLeft,low,unit:UNITS[it.unit||'cp'].dr};
}

function recallMatch(rc,name,barcode,lot){
  if(rc.barcode&&barcode&&rc.barcode!==barcode)return false;
  if(!rc.barcode||!barcode){const words=norm(rc.name).split(' ').filter(w=>w.length>1);if(!words.length||!words.every(w=>norm(name).includes(w)))return false}
  if(rc.lot&&lot&&norm(rc.lot)!==norm(lot))return false;
  return true;
}
function recallHitsRx(r){const out=[];for(const it of r.items){const inf=itemInfo(it);const c=it.catId?catFind(it.catId):null;for(const rc of S.recalls)if(recallMatch(rc,inf.name,c?.barcode,''))out.push(`🚨 سحب من السوق: «${esc(inf.name)}»${rc.lot?` — الحصة (lot) <b>${esc(rc.lot)}</b>، شوف الرقم اللي على العلبة`:''}. ${esc(rc.note||'')} ${rc.src?'— '+esc(rc.src):''}. ما تستعملوش حتى تسول الصيدلي.`)}return out}
function recallHitsHome(){const out=[];for(const h of S.home){const c=h.catId?catFind(h.catId):null;const name=c?.name||h.name;for(const rc of S.recalls)if(recallMatch(rc,name,c?.barcode,h.lot))out.push(`🚨 «${esc(name)}» اللي فالدار${rc.lot?` (lot ${esc(rc.lot)})`:''} تسحب من السوق. ${esc(rc.note||'')}`)}return out}

  const parts=text.split(/(?<=[.!؟?])\s+/);
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang=v?.lang||(code==='fr'?'fr-FR':'ar-SA');if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)});
  if(!v)toast(code==='fr'?'ما لقيتش صوت فرنسي فالجهاز':'ما لقيتش صوت عربي فالجهاز — زيدو من إعدادات التليفون',3500);

function compress(file,max=1100,q=.72){
  return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=url});
}

function vRx(){

  if(!mine.length)h+=`<div class="card empty"><div class="big">📋</div>ما زال ما زدتي حتى وصفة ديال ${esc(me().name)}.<br><br><button class="btn btn-g" onclick="loadDemo()">جرب بمثال</button></div>`;
  // ملخص التعويض
  if(me().org!=='none'&&mine.length){
    const y=String(new Date().getFullYear());let pend=0,pendN=0,paid=0,todo=0;
    for(const r of mine){const st=r.claim?.status||'none';const e=rxReimb(r);if(!e)continue;if(st==='sent'||st==='proc'){pend+=e.exp;pendN++}else if(st==='paid'&&(r.claim.paidDate||'').startsWith(y))paid+=+r.claim.paidAmount||0;else if(st==='none'&&e.exp>0)todo++}

  }
  const list=[...mine].sort((a,b)=>b.date.localeCompare(a.date));
  for(const r of list){const act=rxActive(r);const w=warningsFor(r);const st=r.claim?.status||'none';
    h+=`<div class="card rx" onclick="showRx('${r.id}')">${r.photo?`<img class="thumb" src="${r.photo}" alt="">`:`<div class="ic">📋</div>`}<div class="grow"><b>${fmtDate(r.date)}</b> <span class="pill ${act?'':'grey'}">${act?'جارية':'سالات'}</span>${r.demo?' <span class="pill grey">مثال</span>':''}<div class="small">${r.doctor?esc(r.doctor)+' · ':''}${r.items.length} أدوية · ${money(rxTotal(r))}${me().org!=='none'?` · 💳 ${CLAIM.find(c=>c[0]===st)[1]}`:''}</div>${w.length?`<div class="small" style="color:var(--warn)">⚠️ ${w.length} تنبيه</div>`:''}</div></div>`}
  $('#view').innerHTML=h;
}

function rxShareText(r,l){

  t+=`\n${T.total[l]}: ${rxTotal(r).toFixed(2)} DH`;
  t+=l==='fr'?'\n\n(Wasfati — ne remplace pas l’avis du médecin ou du pharmacien)':'\n\n(وصفتي — ما كيعوضش رأي الطبيب ولا الصيدلي)';
  return t;
}

function suggestNames(v){
  const q=norm(v);const dl=$('#catList');if(!dl)return;
  const own=S.catalog.filter(c=>!q||norm(c.name+' '+c.dci).includes(q)).slice(0,10).map(c=>c.name);
  const ref=q.length>=3?refSearch(v,20).map(refLabel):[];
  dl.innerHTML=[...new Set([...own,...ref])].map(n=>`<option value="${esc(n)}">`).join('');
}
function setName(i,v){const it=E.items[i];let c=S.catalog.find(c=>norm(c.name)===norm(v));
  if(!c&&REF){const r=refIdx.byName.get(norm(v));if(r)c=catFromRef(r)}if(c){it.catId=c.id;it.name=c.name;it.dci=c.dci;it.use=c.use;if(it.price===''||it.price==null)it.price=''}else{it.catId=null;it.name=v}renderEditor()}
function setField(i,k,v){const it=E.items[i];if(it.catId){const c=catFind(it.catId);if(c){c[k]=v}}it[k]=v}
function toggleSlot(i,t){const a=E.items[i].times;const k=a.indexOf(t);if(k>=0)a.splice(k,1);else a.push(t);a.sort();renderEditor()}
function addTime(i,t){const a=E.items[i].times;if(!a.includes(t))a.push(t);a.sort();renderEditor()}
async function addRxPhoto(){const f=await pickFile(true);if(!f)return;try{E.photo=await compress(f);renderEditor()}catch(e){toast('ما قدرتش نقرا الصورة')}}
async function scanInto(i){
  const code=await scanBarcode();if(!code)return;
  let c=S.catalog.find(c=>c.barcode===code);
  if(!c&&REF&&refIdx.byBc.get(code))c=catFromRef(refIdx.byBc.get(code));
  const it=E.items[i];
  if(c){attachPhoto(c);it.catId=c.id;it.name=c.name;it.dci=c.dci;it.use=c.use;toast('✅ '+c.name);renderEditor()}
  else{openCatForm(null,{barcode:code,photo:lastScanPhoto||''},nc=>{it.catId=nc.id;it.name=nc.name;it.dci=nc.dci;it.use=nc.use;renderEditor()});toast('دواء جديد — كمل المعلومات ديالو مرة وحدة',3200)}
}
function saveRx(){
  E.items=E.items.filter(it=>(it.catId||it.name.trim()));
  if(!E.items.length){toast('زيد على الأقل دواء واحد');E.items=[newItem()];renderEditor();return}
  if(E.items.some(it=>!it.times.length)){toast('كل دواء خاصو وقت واحد على الأقل');return}
  for(const it of E.items){ // زيد الدواء للكتالوج إلا ما كانش
    if(!it.catId&&it.name.trim()){const c={id:uid(),name:it.name.trim(),dci:it.dci||'',use:it.use||'',price:+it.price||0,barcode:'',form:it.unit};S.catalog.push(c);it.catId=c.id}
    else if(it.catId&&+it.price){const c=catFind(it.catId);if(c&&!c.price)c.price=+it.price}
  }
  const isNew=E._isNew;delete E._isNew;if(E.personId&&E.personId!==S.cur){S.cur=E.personId;renderWho()}
  const k=S.rx.findIndex(x=>x.id===E.id);if(k>=0)S.rx[k]=E;else S.rx.push(E);
  save();const id=E.id;E=null;render();showRx(id);toast(isNew?'✅ تزادت الوصفة':'✅ تحفظ التعديل');
}

/* ---------- الكاليندر (.ics) ---------- */
function exportIcs(id){
  const r=S.rx.find(x=>x.id===id);const L=[];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  L.push('BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wasfati//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH');
  for(const it of r.items){const inf=itemInfo(it);
    for(const t of it.times){
      const dt=r.date.replace(/-/g,'')+'T'+t.replace(':','')+'00';
      const days=+it.days||30;
      const desc=explain(it,'dr')+(it.note?' — '+it.note:'');
      L.push('BEGIN:VEVENT',`UID:${r.id}-${it.id}-${t.replace(':','')}@wasfati`,`DTSTAMP:${stamp}`,`DTSTART:${dt}`,`DURATION:PT10M`,`RRULE:FREQ=DAILY;COUNT=${days}`,`SUMMARY:💊 ${icsEsc(inf.name)} — ${icsEsc((it.qty||1)+' '+UNITS[it.unit||'cp'].dr)}`,`DESCRIPTION:${icsEsc(desc)}`,'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M',`DESCRIPTION:${icsEsc(inf.name)}`,'END:VALARM','END:VEVENT');
    }}
  L.push('END:VCALENDAR');
  download(`wasfati-${r.date}.ics`,L.join('\r\n'),'text/calendar');
  toast(inFrame?'فالمعاينة التحميل ممنوع — جربها من التطبيق المسطب':'📅 حل الملف وزيدو للكاليندر ديال التليفون',3800);
}
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function download(name,content,type){
  try{const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('التحميل ما خدمش')}
}

function saveCat(){
  const c=window._catDraft;c.name=$('#c_name').value.trim();c.dci=$('#c_dci').value.trim();c.use=$('#c_use').value.trim();c.price=+String($('#c_price').value).replace(',','.')||0;c.barcode=$('#c_bc').value.trim();
  if(!c.name){toast('كتب اسم الدواء');return}
  if(c.barcode){const dup=S.catalog.find(x=>x.barcode===c.barcode&&x.id!==c.id);if(dup){toast('هاد الباركود مسجل لـ '+dup.name);return}}
  const k=S.catalog.findIndex(x=>x.id===c.id);if(k>=0)S.catalog[k]=c;else S.catalog.push(c);save();
  const cb=window._catCb;window._catCb=null;
  if(cb)cb(c);else{closeSheet();render()}
  toast('✅ تحفظ الدواء');
}
function delCat(id){if(S.rx.some(r=>r.items.some(it=>it.catId===id))){toast('هاد الدواء مستعمل فوصفة، ما يمكنش يتمسح');return}S.catalog=S.catalog.filter(c=>c.id!==id);save();closeSheet();render()}
async function importCsv(){
  const f=await pickFile(false,'.csv,text/csv,text/plain');if(!f)return;
  const txt=await f.text();const lines=txt.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return;
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  const parse=l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  let head=parse(lines[0]).map(h=>norm(h));
  const idx=k=>head.findIndex(h=>k.some(x=>h.includes(x)));
  let iN=idx(['name','nom','designation','specialite']),iD=idx(['dci','substance','principe']),iP=idx(['price','prix','ppv']),iB=idx(['barcode','code','ean','gtin']);
  let start=1;if(iN<0){iN=0;iD=1;iP=2;iB=3;start=0}
  let add=0,upd=0;
  for(const l of lines.slice(start)){const c=parse(l);const name=c[iN];if(!name)continue;
    const price=+String(c[iP]||'').replace(/\s/g,'').replace(',','.')||0, bc=(c[iB]||'').replace(/\D/g,''), dci=c[iD]||'';
    const ex=S.catalog.find(x=>(bc&&x.barcode===bc)||norm(x.name)===norm(name));
    if(ex){if(price)ex.price=price;if(dci&&!ex.dci)ex.dci=dci;if(bc&&!ex.barcode)ex.barcode=bc;upd++}
    else{S.catalog.push({id:uid(),name,dci,use:'',price,barcode:bc});add++}}
  save();render();toast(`✅ تزادو ${add} وتحدثو ${upd}`,3500);
}

  S.rx=S.rx.filter(r=>r.personId!==id);S.people=S.people.filter(p=>p.id!==id);if(S.cur===id)S.cur=S.people[0].id;delArm=null;save();renderWho();peopleSheet();render()}

async function restore(){
  const f=await pickFile(false,'.json,application/json');if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.rx))throw 0;
    openSheet(`<div class="bar"><button class="btn btn-g btn-sm" onclick="closeSheet()">✕</button><b>رجّع النسخة؟</b><span></span></div><div class="card">فيها <b>${d.rx.length}</b> وصفات و<b>${(d.catalog||[]).length}</b> دواء فالكتالوج.<div class="alert w">غادي تعوض المعطيات اللي كاينة دابا، ما غاديش تتزاد عليها.</div><button class="btn btn-p" style="width:100%" id="doRestore">نعم، رجّعها</button></div>`);
    $('#doRestore').onclick=()=>{S=migrate(d);renderWho();save();closeSheet();go('today');toast('✅ رجعات النسخة')};
  }catch(e){toast('هاد الملف ماشي نسخة ديال وصفتي')}
}
let wipeArm=false;
function wipe(){if(!wipeArm){wipeArm=true;toast('ضغط مرة أخرى باش تمسح كلشي');setTimeout(()=>wipeArm=false,3500);return}S=blank();save();wipeArm=false;renderWho();go('today');toast('تمسح كلشي')}
